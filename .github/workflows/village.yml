# Replants the field in the banner from the real contribution calendar.
# Commits are made by github-actions[bot], so they never count as
# contributions on the profile itself.
name: Grow the field

on:
  schedule:
    - cron: "17 17 * * *" # 00:17 in Bandung (WIB)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/village.yml"]

permissions:
  contents: write

concurrency: village

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - run: node scripts/village.mjs
      - name: Commit if the field changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --cached --quiet; then
            echo "Nothing new in the field today."
          else
            git commit -m "chore: replant the field"
            git push
          fi

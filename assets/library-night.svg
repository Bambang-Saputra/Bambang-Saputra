<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="96" height="96" shape-rendering="crispEdges" role="img"><title>Pixel art library</title><style>
.twinkle{animation:tw 3.2s ease-in-out infinite}.twinkle.d2{animation-delay:-1.1s}.twinkle.d3{animation-delay:-2.3s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.smoke{animation:sm 4s linear infinite;opacity:0}.smoke.d2{animation-delay:-1.33s}.smoke.d3{animation-delay:-2.66s}
@keyframes sm{0%{transform:translate(0,0);opacity:.0}15%{opacity:.8}100%{transform:translate(3px,-9px);opacity:0}}
.drift{animation:dr 40s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(0)}to{transform:translateX(14px)}}
.blink-a{animation:bl 1.2s steps(1) infinite}.blink-b{animation:bl 1.2s steps(1) infinite;animation-delay:-.6s}
@keyframes bl{0%{opacity:1}50%{opacity:.35}}
.frame-a{animation:fa 1.4s steps(1) infinite}.frame-b{opacity:0;animation:fb 1.4s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}}
.frame-w1{animation:fa .5s steps(1) infinite}.frame-w2{opacity:0;animation:fb .5s steps(1) infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.smoke{opacity:.6}}</style><rect x="0" y="28" width="32" height="4" fill="#21402d"/><rect x="0" y="28" width="32" height="1" fill="#5b4a3a"/><rect x="4" y="17" width="1" height="1" fill="#0a0e18"/><rect x="27" y="17" width="1" height="1" fill="#0a0e18"/><rect x="4" y="18" width="1" height="1" fill="#0a0e18"/><rect x="27" y="18" width="1" height="1" fill="#0a0e18"/><rect x="4" y="19" width="1" height="1" fill="#0a0e18"/><rect x="27" y="19" width="1" height="1" fill="#0a0e18"/><rect x="4" y="20" width="1" height="1" fill="#0a0e18"/><rect x="27" y="20" width="1" height="1" fill="#0a0e18"/><rect x="4" y="21" width="1" height="1" fill="#0a0e18"/><rect x="27" y="21" width="1" height="1" fill="#0a0e18"/><rect x="4" y="22" width="1" height="1" fill="#0a0e18"/><rect x="27" y="22" width="1" height="1" fill="#0a0e18"/><rect x="4" y="23" width="1" height="1" fill="#0a0e18"/><rect x="27" y="23" width="1" height="1" fill="#0a0e18"/><rect x="4" y="24" width="1" height="1" fill="#0a0e18"/><rect x="27" y="24" width="1" height="1" fill="#0a0e18"/><rect x="4" y="25" width="1" height="1" fill="#0a0e18"/><rect x="27" y="25" width="1" height="1" fill="#0a0e18"/><rect x="4" y="26" width="1" height="1" fill="#0a0e18"/><rect x="27" y="26" width="1" height="1" fill="#0a0e18"/><rect x="3" y="16" width="1" height="1" fill="#0a0e18"/><rect x="28" y="16" width="1" height="1" fill="#0a0e18"/><rect x="3" y="15" width="1" height="1" fill="#0a0e18"/><rect x="4" y="14" width="1" height="1" fill="#0a0e18"/><rect x="5" y="14" width="1" height="1" fill="#0a0e18"/><rect x="26" y="14" width="1" height="1" fill="#0a0e18"/><rect x="28" y="15" width="1" height="1" fill="#0a0e18"/><rect x="27" y="14" width="1" height="1" fill="#0a0e18"/><rect x="6" y="13" width="1" height="1" fill="#0a0e18"/><rect x="7" y="13" width="1" height="1" fill="#0a0e18"/><rect x="24" y="13" width="1" height="1" fill="#0a0e18"/><rect x="25" y="13" width="1" height="1" f
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64" shape-rendering="crispEdges" role="img"><title>Pixel art shed</title><style>
.twinkle{animation:tw 3.2s ease-in-out infinite}.twinkle.d2{animation-delay:-1.1s}.twinkle.d3{animation-delay:-2.3s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.smoke{animation:sm 4s linear infinite;opacity:0}.smoke.d2{animation-delay:-1.33s}.smoke.d3{animation-delay:-2.66s}
@keyframes sm{0%{transform:translate(0,0);opacity:.0}15%{opacity:.8}100%{transform:translate(3px,-9px);opacity:0}}
.drift{animation:dr 40s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(0)}to{transform:translateX(14px)}}
.blink-a{animation:bl 1.2s steps(1) infinite}.blink-b{animation:bl 1.2s steps(1) infinite;animation-delay:-.6s}
@keyframes bl{0%{opacity:1}50%{opacity:.35}}
.frame-a{animation:fa 1.4s steps(1) infinite}.frame-b{opacity:0;animation:fb 1.4s steps(1) infinite}
@keyframes fa{0%{opacity:1}50%{opacity:0}}@keyframes fb{0%{opacity:0}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}.smoke{opacity:.6}}</style><rect x="0" y="0" width="32" height="32" fill="#8fc2e8"/><rect x="0" y="28" width="32" height="4" fill="#4e9440"/><rect x="0" y="28" width="32" height="1" fill="#dcb57a"/><rect x="8" y="19" width="1" height="1" fill="#3a2a22"/><rect x="23" y="19" width="1" height="1" fill="#3a2a22"/><rect x="8" y="20" width="1" height="1" fill="#3a2a22"/><rect x="23" y="20" width="1" height="1" fill="#3a2a22"/><rect x="8" y="21" width="1" height="1" fill="#3a2a22"/><rect x="23" y="21" width="1" height="1" fill="#3a2a22"/><rect x="8" y="22" width="1" height="1" fill="#3a2a22"/><rect x="23" y="22" width="1" height="1" fill="#3a2a22"/><rect x="8" y="23" width="1" height="1" fill="#3a2a22"/><rect x="23" y="23" width="1" height="1" fill="#3a2a22"/><rect x="8" y="24" width="1" height="1" fill="#3a2a22"/><rect x="23" y="24" width="1" height="1" fill="#3a2a22"/><rect x="8" y="25" width="1" height="1" fill="#3a2a22"/><rect x="23" y="25" width="1" height="1" fill="#3a2a22"/><rect x="8" y="26" width="1" height="1" fill="#3a2a22"/><rect x="23" y="26" width="1" height="1" fill="#3a2a22"/><rect x="8" y="27" width="1" height="1" fill="#3a2a22"/><rect x="23" y="27" width="1" height="1" fill="#3a2a22"/><rect x="7" y="18" width="1" height="1" fill="#3a2a22"/><rect x="20" y="17" width="1" height="1" fill="#3a2a22"/><rect x="21" y="17" width="1" height="1" fill="#3a2a22"/><rect x="22" y="17" width="1" height="1" fill="#3a2a22"/><rect x="24" y="18" width="1" height="1" fill="#3a2a22"/><rect x="23" y="17" width="1" height="1" fill="#3a2a22"/><rect x="7" y="17" width="1" height="1" fill="#3a2a22"/><rect x="16" y="16" width="1" height="1" fill="#3a2a22"/><rect x="17" y="16" width="1" height="1" fill="#3a2a22"/><rect x="18" y="16" width="1" height="1" fill="#3a2a22"/><rect x="19" y="16" width="1" height="1" fill="#3a2a22"/><rect x="7" y="16" width="1" height="1" fill="#3a2a22"/><rect x="12" y="15" width="1" height="